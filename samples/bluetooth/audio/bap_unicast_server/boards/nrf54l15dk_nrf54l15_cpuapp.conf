CONFIG_FPU=y
CONFIG_LIBLC3=y

# Two sink CISes
CONFIG_BT_ISO_RX_BUF_COUNT=8

# HCI events and ACL data share one RX pool, keep spare buffers while the
# audio thread decodes so that CIS setup is not stalled
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=4

# TLV320 DAC control and I2S audio output
CONFIG_I2C=y
CONFIG_NRFX_I2S=y
CONFIG_CLOCK_CONTROL=y

CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5
CONFIG_THREAD_NAME=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
